# Render service configuration
databases:
  - name: database_db 
    plan: free
    databaseName: production_db 
    user: db_user
    region: virginia # Explicitly set region so DB and services match

envGroups:
  - name: shared_products_env 
    envVars:
      - key: API_KEY 
        value: production
      - key: APP_REGION 
        value: virginia 
      - key: SESSION_SECRET
        generateValue: true 

services:
  - type: web
    name: Evotingdb
    env: node
    region: virginia # Must match database region
    buildCommand: npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - fromGroup: shared_products_env # Correct syntax for environment groups
      - key: DATABASE_URL
        fromDatabase:
          name: production-db
          property: connectionString
      - key: JWT_SECRET 
        generateValue: true 
        key: THIRD_PARTY_API_KEY
        sync: false 

  - type: worker
    name: background-worker
    env: node
    region: virginia 
    startCommand: node worker.js
    envVars:
      - fromGroup: shared_products_env #Correct syntax for environment groups
      - key: DATABASE_URL
        fromDatabase:
          name: production-db
          property: connectionString
