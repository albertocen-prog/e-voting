# 1. Define the native Render PostgreSQL database
databases:
    name: production-db
    plan: free # Options: free, starter, standard, etc.
    databaseName: my_app_db
    user: db_admin

# 2. Define your shared Secret Group
   envGroups:
    name: shared-app-secrets
    envVars:
       key:envGroups:
  - name: shared-app-secrets
    envVars:
      - key: API-ENVIROMENT
        value: production
      # You can still put non-database secrets here (like third-party API keys)

services:
  # 3. Web Service
    type: web
    name: main-web-app
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envGroups:
        name: shared-app-secrets
    envVars:
      # Automatically injects the database connection string securely
        key: DATABASE_URL
        fromDatabase:
          name: production-db
          property: connectionString

  # 4. Background Worker
    type: worker
    name: background-worker
    env: node
    startCommand: node worker.js
    envGroups:
        name: shared-app-secrets
    envVars:
      # Links the exact same database to your worker
        key: DATABASE_URL
        fromDatabase:
          name: production-db
          property: connectionString
