# Render service configuration
databases:
  - name: Evotingdb # Unique blueprint identifier for the database
    plan: free
    databaseName: evotingdb_rhy2 # Actual database name in PostgreSQL
    user: evotingdb_rhy2_user # Database user name
    region: virginia

envGroups:
  - name: share_products_env 
    envVars:
      - key: API_KEY 
        value: production
      - key: APP_REGION 
        value: virginia 
      - key: SESSION_SECRET
        generateValue: true 

services:
  - type: web
    name: e-voting # Web service name
    env: node
    region: virginia
    buildCommand: npm install && npx prisma generate && npx prisma db push && npx prisma db seed && npm run build
    startCommand: npm start
    envVars:
      - fromGroup: share_products_env
      - key: DATABASE_URL
        fromDatabase:
          name: Evotingdb # References the unique database name above
          property: connectionString
      - key: JWT_SECRET 
        generateValue: true 
      - key: THIRD_PARTY_API_KEY
        sync: false 
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: worker
    name: background-worker
    env: node
    region: virginia 
    buildCommand: npm install
    startCommand: node worker.js
    envVars:
      - fromGroup: share_products_env
      - key: DATABASE_URL
        fromDatabase:
          name: Evotingdb # References the unique database name above
          property: connectionString
