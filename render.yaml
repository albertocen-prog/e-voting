# Render service configuration
databases:
  - name: production-db 
    plan: free
    databaseName: E_voting_db
    user: DATABASE_USERNAME 
    region: virginia # Explicitly set region so DB and services match

envGroups:
  - name: shared_products_env 
    envVars:
      - key: API_KEY 
        value: production

services:
  - type: web
    name: e_voting 
    env: node
    region: virginia # Must match database region
    buildCommand: npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - fromGroup: shared_products_env # Correct syntax for environment groups
      - key: DATABASE_URL
        fromDatabase:
          name: production-db
          property: connectionString

  - type: worker
    name: background-worker
    env: node
    region: virginia 
    startCommand: node worker.js
    envVars:
      - fromGroup: shared_products_env #Correct syntax for environment groups
      - key: DATABASE_URL
        fromDatabase:
          name: production-db
          property: connectionString
