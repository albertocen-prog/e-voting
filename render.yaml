# Render service configuration
databases:
  - name: database_db 
    plan: free
    databaseName: evotingdb_rhy2
    user: evotingdb_rhy2_user
    region: virginia # Explicitly set region so DB and services match

envGroups:
  - name: share_products_env 
    envVars:
      - key: API_KEY 
        value: production
      - key: APP_REGION 
        value: virginia 
      - key: SESSION_SECRET
        generateValue: true 

services:
  - type: web
    name: evotingdb_rhy2
    env: node
    region: virginia # Must match database region
    # Updated build command: installs dependencies, generates Prisma client, pushes DB schema, seeds admin user, and builds Next.js 
    buildCommand: npm install && npx prisma generate && npm run build
    preDeployCommand: npx prisma db push && npx prisma db seed
    startCommand: npm start
    envVars:
      - fromGroup: share_products_env # Correct syntax for environment group
      - key: DATABASE_URL
        fromDatabase:
          name: evotingdb_rhy2
          property: connectionString
      - key: JWT_SECRET 
        generateValue: true 
      - key: THIRD_PARTY_API_KEY
        sync: false 
      # Admin Credentials for Seeding and Authentication
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: worker
    name: background-worker
    env: node
    region: virginia 
    buildCommand: npm install
    startCommand: node worker.js
    envVars:
      - fromGroup: share_products_env # Correct syntax for environment groups
      - key: DATABASE_URL
        fromDatabase:
          name: evotingdb_rhy2
          property: connectionString
