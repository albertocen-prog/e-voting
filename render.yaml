# Render service configuration (cleaned)
databases:
  - name: production-db
    plan: free
    databaseName: my_app_db
    user: db_admin

envGroups:
  - name: shared-app-secrets
    envVars:
      - key: API_ENVIRONMENT
        value: production

services:
  - type: web
    name: main-web-app
    env: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envGroups:
      - name: shared-app-secrets
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: production-db
          property: connectionString

  - type: worker
    name: background-worker
    env: node
    startCommand: node worker.js
    envGroups:
      - name: shared-app-secrets
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: production-db
          property: connectionString
