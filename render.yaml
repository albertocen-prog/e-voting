# Render service configuration
databases:
  - name: production-db
    plan: free
    databaseName: my_app_db
    user: db_admin
    region: oregon # Explicitly set region so DB and services match

envGroups:
  - name: shared-app-secrets
    envVars:
      - key: API_ENVIRONMENT
        value: production

services:
  - type: web
    name: e_voting 
    env: node
    region: oregon # Must match database region
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - fromGroup: shared-app-secrets # Correct syntax for environment groups
      - key: DATABASE_URL
        fromDatabase:
          name: production-db
          property: connectionString

  - type: worker
    name: background-worker
    env: node
    region: oregon
    startCommand: node worker.js
    envVars:
      - fromGroup: shared-app-secrets # Correct syntax for environment groups
      - key: DATABASE_URL
        fromDatabase:
          name: production-db
          property: connectionString
