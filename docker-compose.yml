version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: e_voter
      POSTGRES_PASSWORD: password
      POSTGRES_DB: e_voting
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://e_voter:password@db:5432/e_voting
      JWT_SECRET: 'change-me'
    depends_on:
      - db
    command: sh -c "npx prisma migrate deploy && npm start"

volumes:
  db-data:
